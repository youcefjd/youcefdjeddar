title: AI Journal
description: Youcef Djeddar's blog on tech, AI, and building things — at work and for fun
author:
  name: Youcef Djeddar
  url: "https://youcefjd.github.io/youcefdjeddar/about/"

# Tells jekyll-seo-tag to emit Person structured data linking these profiles
social:
  name: Youcef Djeddar
  links:
    - https://www.linkedin.com/in/youcefdjeddar/
    - https://github.com/youcefjd
url: "https://youcefjd.github.io"
baseurl: "/youcefdjeddar"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/

# Sass
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE

# Collections
collections:
  posts:
    output: true
    permalink: /:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
